
<script id="tools">
/* ===== Pure helpers: scenarios, share links, CSV import maths. No DOM. Tested by test_sim.mjs ===== */
var LineTools = (function () {
  'use strict';
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  // set values by path, e.g. {"machines.Labeler.stops_per_hour": 0.17, "buffers.1.capacity": 2000, "reject_rate": 0.02}
  // list items are addressed by index or by name; paths that do not exist are ignored
  function applySet(cfg, set) {
    var c = clone(cfg);
    Object.keys(set || {}).forEach(function (path) {
      var parts = path.split('.'), o = c;
      for (var i = 0; i < parts.length - 1 && o != null; i++) {
        var p = parts[i];
        if (Array.isArray(o)) o = /^\d+$/.test(p) ? o[+p] : o.filter(function (x) { return x && x.name === p; })[0];
        else o = o[p];
      }
      if (o != null && typeof o === 'object') o[parts[parts.length - 1]] = set[path];
    });
    return SimCore.normalize(c);
  }
  function lossPerHour(o) { return (o.stops_per_hour || 0) * (o.stop_mean_min || 0); }

  // what-if list for a line: its own scenarios if it has them, otherwise a generic set
  function scenariosFor(cfg) {
    if (Array.isArray(cfg.scenarios) && cfg.scenarios.length) {
      return cfg.scenarios.map(function (s, i) {
        return { id: s.id || 's' + i, name: s.name || 'Scenario ' + (i + 1), short: s.short || s.name, note: s.note || '', color: s.color || '',
          ref: s.reference_good_per_shift || (i === 0 && cfg.reference ? cfg.reference.good_per_shift : null), cfg: applySet(cfg, s.set) };
      });
    }
    var U = cfg.unit, out = [{ id: 'base', name: 'As set up', short: 'As set up', note: cfg.name, color: 'ink', cfg: SimCore.normalize(cfg) }];
    var set = {}, worst = -1, wv = 0, slow = 0;
    cfg.buffers.forEach(function (b, i) { set['buffers.' + i + '.capacity'] = b.capacity * 2; });
    cfg.machines.forEach(function (m, i) {
      if (lossPerHour(m) > wv) { wv = lossPerHour(m); worst = i; }
      if (m.rated_speed < cfg.machines[slow].rated_speed) slow = i;
    });
    out.push({ id: 'dbl', name: 'Double every buffer', short: '2× buffers', note: 'Every conveyor holds twice as many ' + U, color: 'amb', cfg: applySet(cfg, set) });
    if (worst >= 0) {
      var w = cfg.machines[worst], s1 = {}, s2 = {};
      s1['machines.' + worst + '.stops_per_hour'] = w.stops_per_hour / 2;
      s2['machines.' + worst + '.stops_per_hour'] = 0;
      out.push({ id: 'half', name: 'Halve the stops on the ' + w.name, short: 'Half the ' + w.name + ' stops', note: 'The machine that loses the most minutes per hour', color: '', cfg: applySet(cfg, s1) });
      out.push({ id: 'fix', name: 'Fix the ' + w.name + ' completely', short: w.name + ' fixed', note: 'No stops at all on the ' + w.name, color: 'grn', cfg: applySet(cfg, s2) });
    }
    var s3 = {}; s3['machines.' + slow + '.rated_speed'] = +(cfg.machines[slow].rated_speed * 1.1).toFixed(4);
    if (cfg.ideal_rate <= cfg.machines[slow].rated_speed) s3.ideal_rate = cfg.ideal_rate; // keep the OEE yardstick
    out.push({ id: 'fast', name: 'Speed up the ' + cfg.machines[slow].name + ' by 10%', short: cfg.machines[slow].name + ' +10%', note: 'The slowest machine by rated speed', color: '', cfg: applySet(cfg, s3) });
    var s4 = { conveyor_stops: null };
    cfg.machines.forEach(function (m, i) { s4['machines.' + i + '.stops_per_hour'] = 0; });
    cfg.line_stops.forEach(function (m, i) { s4['line_stops.' + i + '.stops_per_hour'] = 0; s4['line_stops.' + i + '.prob_per_shift'] = 0; });
    out.push({ id: 'nostops', name: 'No stops at all', short: 'No stops', note: 'The ceiling: only speed loss and rejects left', color: '', cfg: applySet(cfg, s4) });
    return out;
  }

  // ---- share links: the whole config as base64url JSON in the URL hash
  function encodeShare(cfg) {
    var bytes = new TextEncoder().encode(JSON.stringify(cfg)), s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeShare(str) {
    var s = atob(str.replace(/-/g, '+').replace(/_/g, '/')), bytes = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return SimCore.normalize(JSON.parse(new TextDecoder().decode(bytes)));
  }

  // ---- CSV
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    var first = text.split(/\r?\n/)[0] || '', delim = ',', best = 0;
    [',', ';', '\t', '|'].forEach(function (d) { var n = first.split(d).length; if (n > best) { best = n; delim = d; } });
    var rows = [], row = [], cur = '', q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    var header = (rows.shift() || []).map(function (h) { return h.trim(); });
    return { header: header, rows: rows.map(function (r) { var o = {}; header.forEach(function (h, k) { o[h] = (r[k] == null ? '' : r[k]).trim(); }); return o; }) };
  }
  function sig(x, n) { return x === 0 ? 0 : Number(x.toPrecision(n || 6)); }
  // same method as skill/line-sim/scripts/derive_params.py
  function stopStats(mins, runMin) {
    mins = mins.filter(function (m) { return m > 0; });
    var n = mins.length;
    if (!n || !(runMin > 0)) return { n_stops: 0, total_min: 0, stops_per_hour: 0, stop_mean_min: 0, stop_spread: 0 };
    var sum = 0, ls = 0, i;
    for (i = 0; i < n; i++) { sum += mins[i]; ls += Math.log(mins[i]); }
    var mu = ls / n, v = 0;
    for (i = 0; i < n; i++) v += Math.pow(Math.log(mins[i]) - mu, 2);
    return { n_stops: n, total_min: Math.round(sum * 100) / 100, stops_per_hour: sig(n / runMin * 60), stop_mean_min: sig(sum / n), stop_spread: sig(Math.sqrt(v / n), 4) };
  }
  // opts: {causeCol, minutesCol, dateCol, shiftCol, filterCol, filterVal, from, to, shifts, shiftMin}
  function deriveStops(rows, o) {
    var by = {}, order = [], total = 0, seen = {}, nSeen = 0, used = 0;
    rows.forEach(function (r) {
      if (o.filterCol && r[o.filterCol] !== o.filterVal) return;
      if (o.dateCol && (o.from || o.to)) {
        var d = String(r[o.dateCol] || '').slice(0, 10);
        if ((o.from && d < o.from) || (o.to && d > o.to)) return;
      }
      var m = parseFloat(String(r[o.minutesCol]).replace(',', '.'));
      used++;
      if (o.dateCol) { var key = r[o.dateCol] + '|' + (o.shiftCol ? r[o.shiftCol] : ''); if (!seen[key]) { seen[key] = 1; nSeen++; } }
      if (!isFinite(m) || m <= 0) return;
      var c = r[o.causeCol] == null ? '' : r[o.causeCol];
      if (!by[c]) { by[c] = []; order.push(c); }
      by[c].push(m); total += m;
    });
    var shifts = o.shifts > 0 ? o.shifts : nSeen;
    var runMin = shifts * o.shiftMin - total;
    return { byCause: by, causes: order, totalDown: total, rows: used, shiftsSeen: o.dateCol ? nSeen : null, shifts: shifts, runMin: runMin,
      stats: function (causes) { var mins = []; causes.forEach(function (c) { mins = mins.concat(by[c] || []); }); return stopStats(mins, runMin); } };
  }
  function guessTarget(cause, machineNames) {
    var c = cause.toLowerCase();
    for (var i = 0; i < machineNames.length; i++) {
      var n = machineNames[i].toLowerCase(), w = n.split(/\s+/)[0];
      if (c.indexOf(n) >= 0 || (w.length >= 4 && c.indexOf(w.slice(0, Math.max(4, w.length - 2))) >= 0)) return 'm' + i;
    }
    if (/change.?over|setup|set-up|format change/.test(c)) return 'start';
    if (/convey/.test(c)) return 'conv';
    if (/break|lunch|meeting|planned maint|no orders|not scheduled/.test(c)) return 'ignore';
    return 'line';
  }

  return { clone: clone, applySet: applySet, scenariosFor: scenariosFor, encodeShare: encodeShare, decodeShare: decodeShare,
    parseCSV: parseCSV, stopStats: stopStats, deriveStops: deriveStops, guessTarget: guessTarget, sig: sig,
    lossPerHour: lossPerHour };
})();
if (typeof module !== 'undefined') module.exports = LineTools;
</script>
